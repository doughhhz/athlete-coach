# Initial program (Implementation Phase 21, ADR-0119): from Treino, answer
# the intake and ask the Personal for the first program. The draft opens
# with the Personal's reasons and athlete-selected load. Activation stays a
# human decision and is NOT done here. Model-dependent: excluded from the
# default suite; run with -IncludeTags initial-program. 1-2 Gemini calls.
appId: app.athletecoach.e2e
name: 09-initial-program
tags:
  - initial-program
---
- runFlow: ../subflows/sign-in-to-tabs.yaml
- runFlow: ../subflows/open-treino-loaded.yaml
- scrollUntilVisible:
    element:
      id: "training-initial-program"
    direction: DOWN
- tapOn:
    id: "training-initial-program"
- extendedWaitUntil:
    visible:
      id: "intake-pain-no"
    timeout: 30000
# Answers may be prefilled by earlier runs: set every one explicitly.
- tapOn:
    id: "intake-pain-no"
- tapOn:
    id: "intake-medical-no"
- scrollUntilVisible:
    element:
      id: "intake-other-sports"
    direction: DOWN
- tapOn:
    id: "intake-other-sports"
- eraseText
- inputText: "Corrida leve aos domingos"
# Closes the keyboard: tap the intro text at the top, above the keyboard
# (non-interactive text, keyboardShouldPersistTaps="handled"). A text below
# may sit behind the keyboard and the tap would hit the keyboard instead.
- scrollUntilVisible:
    element: "O Personal vai montar.*"
    direction: UP
- tapOn: "O Personal vai montar.*"
- scrollUntilVisible:
    element:
      id: "intake-equipment-skip"
    direction: DOWN
- tapOn:
    id: "intake-equipment-skip"
# Centered: a partially visible button at the bottom edge ignores the tap.
- scrollUntilVisible:
    element:
      id: "initial-program-generate"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "initial-program-generate"
- extendedWaitUntil:
    visible:
      # The description sits at the top; "Ativar" is below the reasons.
      id: "program-description|initial-program-error|initial-program-refusal"
    timeout: 180000
    optional: true
# Diagnostics: name the situation when no outcome appeared.
- runFlow:
    when:
      visible:
        id: "initial-program-generating"
    commands:
      - assertVisible: "DIAG STILL GENERATING"
- runFlow:
    when:
      visible:
        id: "initial-program-validation"
    commands:
      - copyTextFrom:
          id: "initial-program-validation"
      - assertVisible: "${'DIAG VALIDATION - ' + maestro.copiedText}"
- runFlow:
    when:
      visible:
        id: "initial-program-error-code"
    commands:
      - copyTextFrom:
          id: "initial-program-error-message"
      - evalScript: ${output.errorMessage = maestro.copiedText}
      - copyTextFrom:
          id: "initial-program-error-code"
      - assertVisible: "${'DIAG ' + maestro.copiedText + ' - ' + output.errorMessage}"
- runFlow:
    when:
      visible:
        id: "initial-program-generate"
    commands:
      - assertVisible: "DIAG STILL ON THE FORM WITHOUT MESSAGE"
- assertNotVisible:
    id: "initial-program-error"
- assertNotVisible:
    id: "initial-program-refusal"
- assertVisible: "Status: Rascunho .*"
- takeScreenshot: 09-initial-program-draft
# Each exercise carries the Personal's reason; load is chosen by the athlete.
- scrollUntilVisible:
    element: "Por que este exerc.cio.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*carga escolhida pelo atleta.*"
- takeScreenshot: 09-initial-program-reasons
