# Smoke: the E2E build launches, is configured (no "Backend nao configurado"),
# renders the sign-in screen and responds to interaction. No network login,
# no Coach/Gemini.
appId: app.athletecoach.e2e
name: 00-smoke
tags:
  - smoke
---
- runFlow: ../subflows/launch-clean.yaml
# ASCII-only regex: Maestro on Windows reads flows as Latin-1 ("nao" = "n.o").
- assertNotVisible: "Backend n.o configurado"
- takeScreenshot: 00-smoke-sign-in
- tapOn:
    id: "auth-switch-mode"
- assertVisible:
    id: "auth-sign-up-screen"
- tapOn:
    id: "auth-switch-mode"
- assertVisible:
    id: "auth-sign-in-screen"
