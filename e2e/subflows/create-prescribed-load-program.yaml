# Creates and activates a one-day program whose only set has a PRESCRIBED
# absolute load of 40 kg (builder defaults: 8-10 reps at RIR 2). Activation
# archives the previous active program, so the progression window starts
# fresh for this run (ADR-0118). Starts and ends on the main tabs.
appId: app.athletecoach.e2e
---
- evalScript: ${output.programName = 'E2E Carga ' + Date.now()}
- runFlow: open-treino-loaded.yaml
- tapOn:
    id: "training-create-program"
- extendedWaitUntil:
    visible:
      id: "builder-program-name"
    timeout: 20000
- tapOn:
    id: "builder-program-name"
- inputText: ${output.programName}
# Closes the keyboard: non-interactive text (keyboardShouldPersistTaps="handled").
- tapOn: "Monte a inten.*"
- scrollUntilVisible:
    element:
      id: "builder-exercise-.*"
    direction: DOWN
- tapOn:
    id: "builder-exercise-.*"
    index: 0
- scrollUntilVisible:
    element:
      id: "builder-set-load-kind-absolute"
    direction: DOWN
- tapOn:
    id: "builder-set-load-kind-absolute"
- scrollUntilVisible:
    element:
      id: "builder-set-load-kg"
    direction: DOWN
- tapOn:
    id: "builder-set-load-kg"
- inputText: "40"
# Closes the keyboard (as in 03-training): the header text is not touchable,
# while the set editor sits inside touchable cards that keep it open.
- scrollUntilVisible:
    element: "Monte a inten.*"
    direction: UP
- tapOn: "Monte a inten.*"
- scrollUntilVisible:
    element:
      id: "builder-save"
    direction: DOWN
- tapOn:
    id: "builder-save"
- extendedWaitUntil:
    visible:
      id: "program-activate|builder-error"
    timeout: 30000
    optional: true
# Diagnostics: each branch fails with a message naming the situation.
- runFlow:
    when:
      visible:
        id: "builder-error"
    commands:
      - copyTextFrom:
          id: "builder-error"
      - assertVisible: "${'BUILDER SAVE FAILED - ' + maestro.copiedText}"
- runFlow:
    when:
      visible:
        id: "builder-save"
    commands:
      - assertVisible: "DIAG STILL ON BUILDER WITHOUT ERROR"
- runFlow:
    when:
      notVisible:
        id: "program-activate"
    commands:
      - assertVisible: "DIAG LEFT BUILDER BUT NO ACTIVATE BUTTON"
- assertVisible: ".*40 kg.*"
- scrollUntilVisible:
    element:
      id: "program-activate"
    direction: DOWN
- tapOn:
    id: "program-activate"
- extendedWaitUntil:
    visible:
      id: "program-start-workout"
    timeout: 30000
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-index"
    timeout: 45000
