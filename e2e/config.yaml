# Maestro workspace (cloud iOS harness). Runs the top-level flows in order;
# subflows are only reached through runFlow.
flows:
  - "flows/*"
# Model-dependent flows run only explicitly (-IncludeTags coach-proposal,
# -IncludeTags initial-program).
excludeTags:
  - coach-proposal
  - initial-program
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 00-smoke
    - 01-auth
    - 02-onboarding
    - 03-training
    - 04-workout
    - 05-coach
    - 06-draft-safety
    - 07-progress
